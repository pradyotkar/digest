<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Travel — Pradyot Kar</title><meta name="description" content="Travel photography and trip writeups by Pradyot Kar."><meta property="og:title" content="Travel — Pradyot Kar"><meta property="og:description" content="Travel photography by Pradyot Kar."><meta property="og:image" content="/logo.png"><meta property="og:url" content="https://pradykar.com/travel"><meta name="twitter:card" content="summary"><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#0b1220;--slate:#5f6b7a;--muted:#7b8796;--border:#dfe5ec;--white:#ffffff;--max-width:1200px;--radius:8px;--blue:#245eea}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--white);color:var(--ink);font-size:16px;line-height:1.6}a{color:var(--blue);text-decoration:none}.navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:64px}.navbar .inner{max-width:var(--max-width);margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:100%}.navbar .logo{font-weight:700;font-size:18px;color:var(--ink)}.nav-links{display:flex;align-items:center;gap:2px}.nav-links a{color:var(--slate);font-size:14px;font-weight:500;padding:8px 14px;border-radius:var(--radius);transition:all .15s}.nav-links a:hover{color:var(--ink);background:var(--surface)}.nav-links a.active{color:var(--ink);font-weight:600}.nav-toggle{display:none;background:none;border:none;font-size:22px;color:var(--ink);cursor:pointer;padding:4px}@media(max-width:768px){.nav-toggle{display:block}.nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--white);flex-direction:column;padding:12px 24px 20px;border-bottom:1px solid var(--border)}.nav-links.open{display:flex}}footer{padding:48px 0;border-top:1px solid var(--border)}footer .inner{max-width:var(--max-width);margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}footer .links{display:flex;gap:20px;flex-wrap:wrap}footer a{color:var(--slate);font-size:14px}footer a:hover{color:var(--ink)}footer .copy{color:var(--muted);font-size:13px}</style></head>
<body>
<nav class="navbar"><div class="inner"><a href="/" class="logo">Pradyot Kar</a><button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Toggle navigation">☰</button><div class="nav-links"><a href="/">Home</a><a href="/experience">Experience</a><a href="/labs">Labs</a><a href="/about">About</a><a href="/contact" class="nav-cta" style="background:var(--blue);color:var(--white)!important;padding:8px 20px!important;border-radius:var(--radius);font-weight:600">Discuss a Project</a></div></div></nav>
<div style="padding:120px 24px 80px;text-align:center;max-width:500px;margin:0 auto"><h1 style="font-size:32px;font-weight:800;margin-bottom:12px">Travel</h1><p style="color:var(--slate);font-size:15px;line-height:1.7">Trip writeups and photography are being prepared. Content will be added here.</p><p style="margin-top:32px"><a href="/" class="btn" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:var(--radius);font-size:15px;font-weight:600;background:var(--blue);color:var(--white)">Back to Home →</a></p></div>
<footer><div class="inner"><div class="links"><a href="/">Home</a><a href="/experience">Experience</a><a href="/labs">Labs</a><a href="/about">About</a><a href="https://www.bayshoreintel.com">Bayshore Intelligence</a></div><span class="copy">© 2026 Pradyot Kar</span></div></footer>
<script>document.addEventListener('click',function(e){var n=document.querySelector('.nav-links'),t=document.querySelector('.nav-toggle');t&&!t.contains(e.target)&&!n.contains(e.target)&&n.classList.remove('open')})</script>
</body></html>
